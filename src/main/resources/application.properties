# Nombre de la Aplicacion
spring.application.name=sistema_gestion_taller

# Configuración de H2 en memoria
spring.datasource.url=jdbc:h2:mem:tallerdhead
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola web de H2 (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar las consultas SQL en la consola para aprender qué hace Hibernate por detrás
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Crea/Actualiza las tablas automáticamente basándose en las clases @Entity
spring.jpa.hibernate.ddl-auto=update
